<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fátima Short</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">

<style>
.video-frame {
  width: 390px;
  height: 844px;
  margin: 0 auto;
  overflow: hidden;
  position: relative;
  background: black;
  border-radius: 30px;
}

.video-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

body{
margin:0;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
font-family:'Cormorant Garamond', serif;
background:black;
}

.bg{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background-image:url('evangelio.jpg.png');
background-size:cover;
background-repeat:no-repeat;
background-position:center;
z-index:1;
}

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.25);
z-index:2;
}

.light{
position:fixed;
width:700px;
height:700px;
border-radius:50%;
background:rgba(255,230,180,0.25);
filter:blur(100px);
top:-160px;
left:-120px;
animation:lightMove 10s ease-in-out infinite alternate;
z-index:-1;
}

.card{
width:90%;
max-width:380px;
text-align:center;
color:white;
text-shadow:0 4px 20px rgba(0,0,0,0.55);
animation:floatCard 8s ease-in-out infinite;
margin:auto;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
position:relative;
z-index:3;
}
  
.symbol{
font-size:58px;
margin-bottom:30px;
opacity:0.9;
animation:floatSymbol 4s ease-in-out infinite;
}

h1{
font-size:74px;
font-weight:300;
line-height:1.12;
margin:0;
letter-spacing:1px;
}

p{
margin-top:38px;
font-size:34px;
opacity:0.9;
letter-spacing:2px;
}

.footer{
position:absolute;
bottom:42px;
font-size:18px;
letter-spacing:6px;
text-transform:uppercase;
color:white;
opacity:0.75;
}

@keyframes slowZoom{
from{transform:scale(1);}
to{transform:scale(1.08);}
}

@keyframes lightMove{
from{transform:translate(0,0) scale(1);}
to{transform:translate(220px,160px) scale(1.2);}
}

@keyframes floatCard{
0%{transform:translateY(0px);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0px);}
}

@keyframes floatSymbol{
0%{transform:translateY(0px);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0px);}
}
</style>
</head>

<body>

<div class="video-frame">

<div class="bg" id="bg"></div>
<div class="overlay"></div>
<div class="light"></div>

<div class="card">
<div class="symbol">✦</div>

<h1 id="text"></h1>

<p id="ref"></p>
</div>

<div class="footer">

</div>

<script>
const scenes = [

{
text:"✝️<br>EVANGELIO<br>DEL DÍA",
ref:"Jn 16, 29-33",
image:"evangelio.jpg.png"
},

{
text:"En el mundo<br>tendrán tribulaciones",
ref:"Jesús",
image:"evangelio.jpg.png"
},

{
text:"Pero<br>tengan valor",
ref:"Juan 16,33",
image:"evangelio.jpg.png"
},

{
text:"Yo he vencido<br>al mundo",
ref:"Cristo",
image:"evangelio.jpg.png"
},

{
text:"No estás sola.<br>Dios sigue contigo.",
ref:"Evangelio del Día",
image:"evangelio.jpg.png"
}

];

let current = 0;

setInterval(()=>{

current++;

if(current >= scenes.length){
current = 0;
}

document.getElementById("text").innerHTML = scenes[current].text;

document.getElementById("ref").innerHTML = scenes[current].ref;

document.getElementById("bg").style.backgroundImage =
"url('" + scenes[current].image + "')";

},5000);
</script>
</div>
</body>
</html>
