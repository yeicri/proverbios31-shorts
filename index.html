<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fátima Short</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body{
margin:0;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
font-family:'Cormorant Garamond', serif;
background:black;
}

.bg{
position:fixed;
inset:0;
background-image:url('fatima1.jpg');
background-size:100% auto;
background-repeat:no-repeat;
background-color:black;
background-position:center 25%;
background-position:center 8%;
transition:background-image 1.5s ease-in-out;
animation:slowZoom 12s ease-in-out infinite alternate;
z-index:-3;
}

.overlay{
position:fixed;
inset:0;
background:linear-gradient(
180deg,
rgba(0,0,0,0.25),
rgba(0,0,0,0.45)
);
z-index:-2;
}

.light{
position:fixed;
width:700px;
height:700px;
border-radius:50%;
background:rgba(255,230,180,0.25);
filter:blur(100px);
top:-160px;
left:-120px;
animation:lightMove 10s ease-in-out infinite alternate;
z-index:-1;
}

.card{
width:78%;
text-align:center;
color:white;
text-shadow:0 4px 20px rgba(0,0,0,0.55);
animation:floatCard 8s ease-in-out infinite;
}

.symbol{
font-size:58px;
margin-bottom:30px;
opacity:0.9;
animation:floatSymbol 4s ease-in-out infinite;
}

h1{
font-size:74px;
font-weight:300;
line-height:1.12;
margin:0;
letter-spacing:1px;
}

p{
margin-top:38px;
font-size:34px;
opacity:0.9;
letter-spacing:2px;
}

.footer{
position:absolute;
bottom:42px;
font-size:18px;
letter-spacing:6px;
text-transform:uppercase;
color:white;
opacity:0.75;
}

@keyframes slowZoom{
from{transform:scale(1);}
to{transform:scale(1.08);}
}

@keyframes lightMove{
from{transform:translate(0,0) scale(1);}
to{transform:translate(220px,160px) scale(1.2);}
}

@keyframes floatCard{
0%{transform:translateY(0px);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0px);}
}

@keyframes floatSymbol{
0%{transform:translateY(0px);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0px);}
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>
<div class="overlay"></div>
<div class="light"></div>

<div class="card">
<div class="symbol">✦</div>

<h1 id="text">
Mi Inmaculado Corazón<br>
será tu refugio
</h1>

<p id="ref">
Virgen de Fátima
</p>
</div>

<div class="footer">
NUESTRA SEÑORA DE FÁTIMA
</div>

<script>
const scenes = [
{
text:"Mi Inmaculado Corazón<br>será tu refugio",
ref:"Virgen de Fátima",
image:"fatima1.jpg.png"
},
{
text:"Recen el Rosario<br>todos los días",
ref:"Fátima 1917",
image:"fatima2.jpg.png"
},
{
text:"Hagan sacrificios<br>por los pecadores",
ref:"Nuestra Señora de Fátima",
image:"fatima3.jpg.png"
},
{
text:"No ofendan más<br>a Dios Nuestro Señor",
ref:"Mensaje de Fátima",
image:"fatima4.jpg.png"
}
];

let current = 0;

setInterval(()=>{
current++;
if(current >= scenes.length){
current = 0;
}

document.getElementById("text").innerHTML = scenes[current].text;
document.getElementById("ref").innerHTML = scenes[current].ref;
document.getElementById("bg").style.backgroundImage =
"url('" + scenes[current].image + "')";

},5000);
</script>

</body>
</html>
