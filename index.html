<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proverbios 31 Shorts</title>

<style>
body{
margin:0;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
font-family:'Cormorant Garamond', serif;
background:linear-gradient(180deg,#f5eee6 0%,#d8c3a5 50%,#8e735b 100%);
}

.light{
position:fixed;
width:700px;
height:700px;
border-radius:50%;
background:rgba(255,255,255,0.38);
filter:blur(90px);
top:-180px;
left:-180px;
animation:lightMove 10s ease-in-out infinite alternate;
}

.light2{
position:fixed;
width:600px;
height:600px;
border-radius:50%;
background:rgba(255,230,190,0.28);
filter:blur(100px);
bottom:-180px;
right:-160px;
animation:lightMove2 12s ease-in-out infinite alternate;
}

.card{
width:75%;
text-align:center;
color:#2f241d;
animation:floatCard 8s ease-in-out infinite;
}

.symbol{
font-size:60px;
margin-bottom:35px;
opacity:0.75;
animation:floatSymbol 4s ease-in-out infinite;
}

h1{
font-size:72px;
font-weight:400;
line-height:1.15;
margin:0;
}

p{
margin-top:40px;
font-size:34px;
opacity:0.8;
}

.footer{
position:absolute;
bottom:40px;
font-size:18px;
letter-spacing:5px;
text-transform:uppercase;
opacity:0.6;
}

@keyframes lightMove{
from{transform:translate(0,0) scale(1);}
to{transform:translate(260px,180px) scale(1.25);}
}

@keyframes lightMove2{
from{transform:translate(0,0) scale(1);}
to{transform:translate(-240px,-160px) scale(1.2);}
}

@keyframes floatCard{
0%{transform:translateY(0px) scale(1);}
50%{transform:translateY(-10px) scale(1.02);}
100%{transform:translateY(0px) scale(1);}
}

@keyframes floatSymbol{
0%{transform:translateY(0px);}
50%{transform:translateY(-14px);}
100%{transform:translateY(0px);}
}
</style>
</head>

<body>

<div class="light"></div>
<div class="light2"></div>

<div class="card">
<div class="symbol">✦</div>

<h1 id="verse">
La mujer sabia<br>
edifica su casa
</h1>

<p id="reference">
Proverbios 14:1
</p>
</div>

<div class="footer">
PROVERBIOS 31
</div>

<script>
const verses = [
{text:"La mujer sabia<br>edifica su casa", ref:"Proverbios 14:1"},
{text:"Está vestida<br>de fortaleza y dignidad", ref:"Proverbios 31:25"},
{text:"Abre su boca<br>con sabiduría", ref:"Proverbios 31:26"},
{text:"Su lámpara<br>no se apaga de noche", ref:"Proverbios 31:18"},
{text:"Engañosa es la gracia<br>y vana la belleza", ref:"Proverbios 31:30"}
];

let current = 0;

setInterval(()=>{
current++;
if(current >= verses.length){current = 0;}

document.getElementById("verse").innerHTML = verses[current].text;
document.getElementById("reference").innerHTML = verses[current].ref;
},5000);
</script>

</body>
</html>
