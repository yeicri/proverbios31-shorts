<div class="footer">

</div>

<audio autoplay loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8f6db0f8d.mp3?filename=calm-piano-ambient-110397.mp3" type="audio/mpeg">
</audio>

<script>

const verses = [

{
text:"La mujer sabia<br>edifica su casa",
ref:"Proverbios 14:1"
},

{
text:"Está vestida<br>de fortaleza y dignidad",
ref:"Proverbios 31:25"
},

{
text:"Abre su boca<br>con sabiduría",
ref:"Proverbios 31:26"
},

{
text:"Su lámpara<br>no se apaga de noche",
ref:"Proverbios 31:18"
},

{
text:"Engañosa es la gracia<br>y vana la belleza",
ref:"Proverbios 31:30"
}

];

let current = 0;

setInterval(()=>{

current++;

if(current >= verses.length){
current = 0;
}

document.getElementById("verse").innerHTML =
verses[current].text;

document.getElementById("reference").innerHTML =
verses[current].ref;

},5000);

</script>

</body>
</html>
