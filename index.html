<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Proverbios 31 Shorts</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:
linear-gradient(180deg,#f5eee6 0%,#d8c3a5 50%,#8e735b 100%);
font-family:Georgia, serif;
}

.glow{
position:absolute;
width:500px;
height:500px;
border-radius:999px;
background:rgba(255,255,255,0.35);
filter:blur(80px);
top:-100px;
left:-100px;
}

.card{
width:70%;
text-align:center;
color:#2f241d;
animation:fade 2s ease;
}

.symbol{
font-size:60px;
margin-bottom:30px;
opacity:0.7;
}

h1{
font-size:70px;
font-weight:400;
line-height:1.2;
margin:0;
}

p{
margin-top:40px;
font-size:32px;
opacity:0.8;
}

.footer{
position:absolute;
bottom:40px;
font-size:18px;
letter-spacing:4px;
text-transform:uppercase;
opacity:0.6;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0px);
}
}

</style>
</head>

<body>

<div class="glow"></div>

<div class="card">

<div class="symbol">✦</div>

<h1>
La mujer sabia<br>
edifica su casa
</h1>

<p>
Proverbios 14:1
</p>

</div>

<div class="footer">
Proverbios 31
</div>

</body>
</html>
